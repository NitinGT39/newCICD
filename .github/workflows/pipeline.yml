name: Pipeline
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  train-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Download project code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
      - name: Install libraries
        run: pip install -r requirements.txt
      - name: ML model traing
        run: python train.py
      - name: ML model Tesing
        run: python test.py
      - name: Deployment
        if: success() && github.ref == 'refs/heads/main'
        env:
          DEPLOY_HOOK_URL: ${{secrets.RENDER_DEPLOY_HOOK_URL}}
        run: curl --fail --silent --show-error "$DEPLOY_HOOK_URL"